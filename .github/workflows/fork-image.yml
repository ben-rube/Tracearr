# Fork-only: build the patched image (LOCAL_NETWORKS support) for amd64
# and publish it as ghcr.io/<owner>/tracearr:<UPSTREAM_VERSION>-localnet
name: Fork Image

on:
  push:
    branches: [localnet]
  workflow_dispatch:

env:
  UPSTREAM_VERSION: '2.7.1'

jobs:
  build:
    if: github.repository_owner != 'connorgallopo'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Fetch basemap
        uses: ./.github/actions/fetch-basemap

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/tracearr:${{ env.UPSTREAM_VERSION }}-localnet
          build-args: |
            APP_VERSION=v${{ env.UPSTREAM_VERSION }}
            APP_TAG=v${{ env.UPSTREAM_VERSION }}-localnet
            APP_COMMIT=${{ github.sha }}
            APP_BUILD_DATE=${{ github.event.head_commit.timestamp }}
            CACHE_BUST=${{ github.sha }}
