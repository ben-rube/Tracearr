# Fork-only: rebase this branch's patch (LOCAL_NETWORKS support) onto
# upstream's latest release and publish ghcr.io/<owner>/tracearr:<version>-localnet.
# Runs daily (skipped when that release is already built); push or manual run always rebuilds.
# Scheduled runs need this branch to be the repo's default branch.
name: Fork Image

on:
  schedule:
    - cron: '0 9 * * *'
  push:
    branches: [localnet]
  workflow_dispatch:

concurrency:
  group: fork-image
  cancel-in-progress: false

env:
  UPSTREAM: connorgallopo/Tracearr

jobs:
  build:
    if: github.repository_owner != 'connorgallopo'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Resolve latest upstream release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api "repos/$UPSTREAM/releases/latest" --jq .tag_name)
          version=${tag#v}
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tracearr:${version}-localnet"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Latest upstream release: $tag -> $image"

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if already built
        id: check
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && docker manifest inspect "${{ steps.release.outputs.image }}" > /dev/null 2>&1; then
            echo "Image exists, nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Rebase patch onto upstream release
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags "https://github.com/$UPSTREAM.git" "refs/tags/${{ steps.release.outputs.tag }}:refs/tags/upstream-release"
          git fetch --no-tags "https://github.com/$UPSTREAM.git" "+refs/heads/main:refs/remotes/upstream/main"
          base=$(git merge-base HEAD upstream/main)
          echo "Patch commits:"
          git log --oneline "$base..HEAD"
          git rebase --onto upstream-release "$base"

      - name: Fetch basemap
        if: steps.check.outputs.skip != 'true'
        uses: ./.github/actions/fetch-basemap

      - name: Set up Docker Buildx
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build and push
        if: steps.check.outputs.skip != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.release.outputs.image }}
          build-args: |
            APP_VERSION=${{ steps.release.outputs.tag }}
            APP_TAG=${{ steps.release.outputs.tag }}-localnet
            APP_COMMIT=${{ github.sha }}
            CACHE_BUST=${{ github.sha }}
